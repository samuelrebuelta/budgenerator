name: Validate budgenerator
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # functions/ tiene su propio lockfile; los tests de la raíz importan functions/src.
      - run: pnpm --dir functions install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm test
      - run: pnpm build:functions
      - run: pnpm test:notifications:emulator
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: test-artifacts/
  mobile:
    # App nativa (apps/mobile): sin builds nativos, sólo TypeScript y Jest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bg/mobile typecheck
      - run: pnpm --filter @bg/mobile test
